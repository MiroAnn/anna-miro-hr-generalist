name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Render static page
        shell: bash
        run: |
          npm run start &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ --output /tmp/anna-miro-index.html; then
              break
            fi
            sleep 1
          done
          kill "$server_pid" || true
          test -s /tmp/anna-miro-index.html
          mkdir -p _site
          cp -R dist/client/. _site/
          sed 's|href="/|href="/anna-miro-hr-generalist/|g; s|src="/|src="/anna-miro-hr-generalist/|g' /tmp/anna-miro-index.html > _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
